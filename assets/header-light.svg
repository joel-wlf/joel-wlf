<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Joel Wolf — product-minded full-stack developer</title>
  <desc id="desc">An animated product pipeline from real-world problem to reliable software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8f5"/>
      <stop offset="1" stop-color="#e7f0ea"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#198754" stop-opacity="0"/>
      <stop offset=".5" stop-color="#198754"/>
      <stop offset="1" stop-color="#48b879" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c8ddd0" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse:nth-of-type(2) { animation-delay: .65s; }
      .pulse:nth-of-type(3) { animation-delay: 1.3s; }
      .pulse:nth-of-type(4) { animation-delay: 1.95s; }
      .packet { animation: travel 5s linear infinite; }
      .scan { animation: scan 7s ease-in-out infinite; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes pulse { 0%,100% { opacity:.5; transform:scale(.92) } 50% { opacity:1; transform:scale(1.08) } }
      @keyframes travel { 0% { transform:translateX(0); opacity:0 } 8% { opacity:1 } 92% { opacity:1 } 100% { transform:translateX(588px); opacity:0 } }
      @keyframes scan { 0%,100% { transform:translateX(-220px); opacity:0 } 15%,85% { opacity:.55 } 50% { transform:translateX(930px); opacity:.15 } }
      @keyframes blink { 0%,48% { opacity:1 } 49%,100% { opacity:0 } }
      @media (prefers-reduced-motion: reduce) { * { animation:none!important } }
    </style>
  </defs>

  <rect width="1000" height="280" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="24" fill="url(#grid)" opacity=".55"/>
  <rect class="scan" x="0" y="0" width="190" height="280" fill="url(#accent)" opacity=".35"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="56" y="76" fill="#10251a" font-size="42" font-weight="750" letter-spacing="-1.5">Joel Wolf</text>
    <text x="56" y="112" fill="#345c47" font-size="19" font-weight="500">Product-minded full-stack developer<tspan class="caret" fill="#198754">_</tspan></text>
    <text x="56" y="148" fill="#5c7769" font-size="15">I turn real operations into reliable software.</text>
  </g>

  <g transform="translate(58 202)">
    <path d="M12 0H600" stroke="#c8ddd0" stroke-width="3" stroke-linecap="round"/>
    <rect class="packet" x="6" y="-4" width="20" height="8" rx="4" fill="#198754" filter="url(#softGlow)"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="650" text-anchor="middle">
      <g class="pulse"><circle cx="12" cy="0" r="8" fill="#198754"/><text x="12" y="30" fill="#5c7769">problem</text></g>
      <g class="pulse"><circle cx="208" cy="0" r="8" fill="#198754"/><text x="208" y="30" fill="#5c7769">workflow</text></g>
      <g class="pulse"><circle cx="404" cy="0" r="8" fill="#198754"/><text x="404" y="30" fill="#5c7769">product</text></g>
      <g class="pulse"><circle cx="600" cy="0" r="8" fill="#48b879"/><text x="600" y="30" fill="#5c7769">impact</text></g>
    </g>
  </g>

  <g transform="translate(750 56)" fill="none" stroke="#345c47" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="190" height="150" rx="16" fill="#e7f0ea" fill-opacity=".72" stroke="#c8ddd0"/>
    <path d="M26 40h42M26 62h92M26 84h68" stroke-width="5" opacity=".45"/>
    <path d="m123 116 17-17 12 12 21-29" stroke="#198754" stroke-width="5"/>
    <circle cx="173" cy="82" r="5" fill="#48b879" stroke="none" class="pulse"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="310" viewBox="0 0 920 310" role="img" aria-labelledby="title desc">
  <title id="title">Joel Wolf developer information card</title>
  <desc id="desc">A terminal-style card describing Joel's role, focus, stack and contact information.</desc>
  <text x="24" y="24" class="prompt">$ whoami</text>
  <text x="24" y="69" class="name">Joel Wolf</text>
  <text x="24" y="96" class="tagline">I build useful software for real-world work.</text>
  <line x1="24" y1="116" x2="896" y2="116" class="divider" />
  <g class="row" style="animation-delay:0.28s"><text x="24" y="151" class="key">role</text><text x="116" y="151" class="value">product-minded full-stack developer</text></g><g class="row" style="animation-delay:0.38s"><text x="24" y="182" class="key">based</text><text x="116" y="182" class="value">Germany</text></g><g class="row" style="animation-delay:0.48s"><text x="24" y="213" class="key">focus</text><text x="116" y="213" class="value">operational + embedded systems</text></g><g class="row" style="animation-delay:0.58s"><text x="24" y="244" class="key">contact</text><text x="116" y="244" class="value">joel377wolf@gmail.com</text></g><g class="row" style="animation-delay:0.68s"><text x="489" y="151" class="key">stack</text><text x="581" y="151" class="value">TypeScript · React · Next.js · Electron</text></g><g class="row" style="animation-delay:0.78s"><text x="489" y="182" class="key">data</text><text x="581" y="182" class="value">PostgreSQL · Prisma · Supabase · PocketBase</text></g><g class="row" style="animation-delay:0.88s"><text x="489" y="213" class="key">infra</text><text x="581" y="213" class="value">AWS · Docker · Linux · Cloudflare</text></g><g class="row" style="animation-delay:0.98s"><text x="489" y="244" class="key">method</text><text x="581" y="244" class="value">understand the workflow, then simplify it</text></g>
  <line x1="24" y1="279" x2="896" y2="279" class="divider" />
  <text x="24" y="301" class="footer">available for thoughtful products &amp; hard operational problems</text>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .prompt { fill: #5eead4; font-size: 13px; font-weight: 700; }
    .name { fill: #5eead4; font-size: 32px; font-weight: 800; letter-spacing: -.5px; }
    .tagline { fill: #cbd5e1; font-size: 13px; }
    .key { fill: #60a5fa; font-size: 12px; font-weight: 700; }
    .value { fill: #dbe5f1; font-size: 11.5px; }
    .footer { fill: #94a3b8; font-size: 9.8px; }
    .divider { stroke: #334155; stroke-width: 1; }
    .row { opacity: 0; transform: translateX(-9px); animation: reveal .38s ease-out forwards; }
    .row.static { opacity: 1; transform: none; animation: none; }
    @keyframes reveal { to { opacity: 1; transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .row { opacity: 1; transform: none; animation: none; } }
    @media (prefers-color-scheme: light) {
      .prompt, .name { fill: #0f766e; }
      .tagline, .value { fill: #0f172a; }
      .key { fill: #2563eb; }
      .footer { fill: #64748b; }
      .divider { stroke: #cbd5e1; }
    }
  </style>
</svg>
